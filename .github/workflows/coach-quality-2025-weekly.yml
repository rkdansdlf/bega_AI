name: Coach Quality Loop 2025 Weekly

on:
  schedule:
    - cron: "0 18 * * 0" # 월요일 03:00 KST
  workflow_dispatch:

concurrency:
  group: coach-cache-operations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality-loop-2025:
    name: Coach Quality Loop (2025 Regular, 10 Teams)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      POSTGRES_DB_URL: ${{ secrets.COACH_QUALITY_DB_URL_STAGING_RW }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_STAGING }}
      LLM_PROVIDER: openrouter
      COACH_LLM_PROVIDER: openrouter

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          missing=()
          if [ -z "${POSTGRES_DB_URL}" ]; then
            missing+=(COACH_QUALITY_DB_URL_STAGING_RW)
          fi
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            missing+=(OPENROUTER_API_KEY_STAGING)
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # TTL cleanup excludes batch-owned prompt versions by default
      # (COACH_BATCH_OWNED_PROMPT_VERSIONS), so it can never delete the rows the
      # rebuild below keeps as previous_kept, and the batch plan's
      # force_rebuild_replace_keys stay valid after the TTL execute step.
      # Live-contract rows older than 7d are deleted on purpose: the live API's
      # COMPLETED TTL is 24h, so they are already expired for readers.
      - name: Cleanup cache dry-run (7d, year=2025)
        run: |
          python scripts/cleanup_expired_cache.py \
            --days 7 \
            --years 2025 \
            --dry-run \
            --output /tmp/coach_cleanup_2025_dryrun.json

      - name: Batch cleanup/rebuild plan dry-run (year=2025)
        run: |
          python scripts/batch_coach_cache.py \
            --years 2025 \
            --force-rebuild \
            --purge-invalid-years \
            --cleanup-legacy \
            --game-type REGULAR \
            --dry-run \
            --quality-report /tmp/coach_batch_plan_2025_dryrun.json

      - name: Cleanup cache execute (7d, year=2025)
        run: |
          python scripts/cleanup_expired_cache.py \
            --days 7 \
            --years 2025 \
            --output /tmp/coach_cleanup_2025_execute.json

      # --force-rebuild is now verify-then-replace: it deletes nothing up front
      # and replaces existing COMPLETED rows only after the new result validates.
      # The quality gate requires 10 freshly generated successes.
      # --purge-invalid-years only removes batch-owned prompt versions
      # (never the live API contract), keeping cache_integrity at 0.
      # --cleanup-legacy is the only switch that lets the batch DELETE its own
      # legacy/mismatch/stale-PENDING rows; warmup and ad-hoc runs never pass it.
      - name: Rebuild coach cache for 2025 regular season
        id: rebuild
        run: |
          python scripts/batch_coach_cache.py \
            --years 2025 \
            --force-rebuild \
            --purge-invalid-years \
            --cleanup-legacy \
            --game-type REGULAR \
            --quality-report /tmp/coach_quality_2025_weekly.json

      # Run the gate even when the rebuild exits non-zero (partial failures),
      # so the gate report states the failure codes explicitly.
      - name: Evaluate coach quality gate
        if: ${{ !cancelled() && steps.rebuild.outcome != 'skipped' }}
        run: |
          python scripts/evaluate_coach_quality.py \
            /tmp/coach_quality_2025_weekly.json \
            --required-generated-success 10 \
            --require-years 2025 \
            --require-game-type REGULAR \
            --output /tmp/coach_quality_gate_2025_weekly.json

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coach-quality-2025-weekly
          path: |
            /tmp/coach_cleanup_2025_dryrun.json
            /tmp/coach_batch_plan_2025_dryrun.json
            /tmp/coach_cleanup_2025_execute.json
            /tmp/coach_quality_2025_weekly.json
            /tmp/coach_quality_gate_2025_weekly.json
          retention-days: 7
